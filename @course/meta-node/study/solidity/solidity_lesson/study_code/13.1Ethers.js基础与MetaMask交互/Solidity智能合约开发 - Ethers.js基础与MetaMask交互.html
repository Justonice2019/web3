                    try {
                        const tx = await signer.sendTransaction({
                            to: account,
                            value: 100000n,
                            gasLimit: 100n,
                            gasPrice: 100
                        })
                        const receipt = await tx.wait()

            <h3>gas估算</h3>
            <div>
                <button onClick={async () => {
                    const contract = new ethers.Contract(contractAddress, exampleArtifact.abi, signer)
                    const gas = await contract.getCount.estimateGas()
                    console.log(gas) // 23746n

                    // const gasLimit = gas / 100n * 110n // 23746n 网上浮动 10%
                    const gasLimit = 10n // 设置的过小会导致函数调用失败
                    const count = await contract.getCount({
                        gasLimit
                    })
                    console.log(count)
                }}>getCount()
                </button>
                <button onClick={async () => {
                    const contract = new ethers.Contract(contractAddress, exampleArtifact.abi, signer)
                    const gas = await contract.addCount.estimateGas()
                    console.log(gas) // 27720n

                    const gasLimit = gas / 100n * 110n // 23746n 网上浮动 10%
                    // const gasLimit = 10n // 设置的过小会导致函数调用失败
                    const tx = await contract['addCount(uint256)'](2n, {
                        gasLimit
                    })
                    const receipt = await tx.wait()
                    if (receipt.status === 1) {
                        const count = await contract.getCount()
                        console.log(count)
                    }

                }}>addCount(uint256)
                </button>

            <h3>交易状态跟踪</h3>
            <div>
                <button onClick={async () => {
                    const contract = new ethers.Contract(contractAddress, exampleArtifact.abi, signer)

                    const tx = await contract.addCount()
                    const receipt = await tx.wait()
                    if (receipt.status === 1) {
                        const count = await contract.getCount()
                        console.log(count)
                    }

                </button>

                    const tx = await contract.addCount()

                    console.log(tx, tx2)

            <h1>签名消息</h1>
            <div>
                <span>hello</span>
                <button onClick={async () => {
                    const signature = await signer.signMessage('hello')
                    console.log(signature) // 0x24c70c006ccb4dc976880d47d592a3ee8ada3b0120c25d765d257207558eb8806188bab6aedd473f3c7e1ff39bc3d78a62ef82acff641698793fbf2aa7a878f11b
                }}>签名消息
                </button>
                <button onClick={async () => {
                    const recoveredAddress = ethers.verifyMessage('hello', '0x24c70c006ccb4dc976880d47d592a3ee8ada3b0120c25d765d257207558eb8806188bab6aedd473f3c7e1ff39bc3d78a62ef82acff641698793fbf2aa7a878f11b')
                    console.log(recoveredAddress) // 0xF1DC5Df8114fdd22B43a3925C8A0A768A776D885

                    const isValid = recoveredAddress.toLowerCase() === signer.address.toLowerCase()
                    console.log('签名有效:', isValid)

                }}>验证签名
                </button>
                <button onClick={async () => {
                    const messageHash = ethers.hashMessage('hello')
                    console.log(messageHash) // 0x50b2c43fd39106bafbba0da34fc430e1f91e3c96ea2acee2bc34119f92b37750

                    const signature = await signer.signMessage(messageHash)
                    console.log(signature) // 0x4cb3d79725325430d90201468cbf5b8e866dbfeaae42e32c1f765b7b4833f1b12e32f516c4f4660b98ae554bee031cfcf89021935738ce6ed86d42e5a4006c131b
                }}>
                    EIP-191标准消息签名
                </button>

                <button onClick={async () => {
                    const domain = {
                        name: 'MyDApp',           // 随便写，比如 'MyApp', 'TestApp'
                        version: '1',             // 随便写
                        chainId: 11155111,               // 主网写1，测试网写对应ID
                        verifyingContract: '0x99bb391a6fa6Cb8cb0941f986373869129E58d11'  // 用您的合约地址
                    }

                    // Types - 可以随意定义数据结构
                    const types = {
                        AddCount: [
                            {name: 'delta', type: 'uint256'},
                        ],
                    }

                    // Value - 填写具体的测试数据
                    const value = {
                        delta: 2,
                    }

                    async function signTypedData(signer) {
                        try {
                            // 注意：所有地址需要是 checksum 格式
                            const signature = await signer.signTypedData(domain, types, value)
                            console.log('签名成功:', signature)
                            return signature
                        } catch (error) {
                            console.error('签名失败:', error)
                            throw error
                        }
                    }

                    function verifyTypedData(signature) {
                        try {
                            const recoveredAddress = ethers.verifyTypedData(domain, types, value, signature)
                            console.log('恢复的地址:', recoveredAddress)
                            return recoveredAddress
                        } catch (error) {
                            console.error('验证失败:', error)
                            throw error
                        }
                    }

                    // 签名
                    const signature = await signTypedData(signer)

                    // 验证
                    const recovered = verifyTypedData(signature)
                    console.log('签名者地址:', await signer.getAddress())
                    console.log('验证匹配:', recovered.toLowerCase() === (await signer.getAddress()).toLowerCase())
                }}>EIP-712结构化消息签名
                </button>
            </div>
        </div>)
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>)
</script>
